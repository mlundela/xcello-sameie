name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # tests/db.test.ts runs the migrations and accounting logic against a real Postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xcello
          POSTGRES_USER: xcello
          POSTGRES_PASSWORD: xcello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xcello -d xcello"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://xcello:xcello@localhost:5432/xcello
    steps:
      - uses: actions/checkout@v7

      # Without an input setup-bun installs the latest bun, not the one the lockfile and image use
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test

      # Tenant isolation and member roles against the running app (tests/tenant.e2e.ts). The
      # secrets are placeholders: the tests create users in the database and send no email.
      - name: Start the dev server
        run: bun run dev > dev.log 2>&1 &
        env:
          ORIGIN: http://localhost:5173
          BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: CI <ci@example.com>

      - name: Wait for the dev server
        run: for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:5173/login && exit 0; sleep 2; done; cat dev.log; exit 1

      - run: bun run test:e2e

      # The production build the Docker image runs; needs no env (see `building` in $lib/server)
      - run: bun run build
