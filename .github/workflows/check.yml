name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # tests/db.test.ts runs the migrations and accounting logic against a real Postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xcello
          POSTGRES_USER: xcello
          POSTGRES_PASSWORD: xcello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xcello -d xcello"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://xcello:xcello@localhost:5432/xcello
    steps:
      - uses: actions/checkout@v7

      # Without an input setup-bun installs the latest bun, not the one the lockfile and image use
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test

      # The production build the Docker image runs; needs no env (see `building` in $lib/server)
      - run: bun run build
